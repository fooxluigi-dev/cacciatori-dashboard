<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 Cacciatori — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',sans-serif;
  background:#f5f2eb;
  color:#2d2d2d;
  min-height:100vh;
  padding-bottom:80px;
}
/* Hero */
.hero{
  background:linear-gradient(135deg,#1a3c34,#2d5a4a);
  color:#fff;
  padding:48px 20px 36px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.hero h1{font-size:1.8rem;font-weight:800;letter-spacing:-0.5px}
.hero .sub{font-size:0.85rem;opacity:0.8;margin-top:4px}
.hero .badge{
  display:inline-block;
  margin-top:12px;
  padding:6px 16px;
  background:rgba(255,255,255,0.1);
  border-radius:100px;
  font-size:0.75rem;
  backdrop-filter:blur(4px);
}
/* Stats */
.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:8px;
  padding:16px;
  margin:-24px 12px 0;
}
.stat{
  background:#fff;
  border-radius:16px;
  padding:14px 8px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,0.06);
}
.stat .num{font-size:1.5rem;font-weight:800;color:#1a3c34}
.stat .label{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.3px;color:#888;margin-top:2px}
/* Filters */
.filters{
  display:flex;
  gap:6px;
  padding:12px 16px 4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  flex-shrink:0;
  padding:7px 16px;
  border-radius:100px;
  border:1.5px solid #ddd;
  background:#fff;
  font-size:0.8rem;
  font-weight:500;
  cursor:pointer;
  transition:all 0.2s;
  color:#555;
}
.filter-btn.active{background:#1a3c34;color:#fff;border-color:#1a3c34}
.filter-btn:hover:not(.active){background:#f0f0f0}
/* Sections */
.section{
  margin:16px;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.04);
}
.section-header{
  padding:16px 18px 12px;
  border-bottom:1px solid #f0eee8;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.section-header h2{font-size:1rem;font-weight:700}
.section-header .count{
  font-size:0.75rem;
  color:#888;
  background:#f5f2eb;
  padding:3px 10px;
  border-radius:100px;
}
/* Table */
.table-wrap{overflow-x:auto;padding:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:0.78rem;min-width:500px}
th{
  text-align:left;
  padding:10px 12px;
  font-weight:600;
  color:#888;
  font-size:0.7rem;
  text-transform:uppercase;
  letter-spacing:0.3px;
  background:#faf8f4;
  border-bottom:1px solid #f0eee8;
  white-space:nowrap;
  position:sticky;
  top:0;
}
td{padding:10px 12px;border-bottom:1px solid #f5f2eb;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf8f4}
/* Hunter cards */
.hunter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:12px;
}
.hunter-card{
  background:#faf8f4;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.hunter-card .name{font-weight:600;font-size:0.9rem}
.hunter-card .count{font-size:1.3rem;font-weight:800;color:#1a3c34;margin-top:4px}
.hunter-card .label{font-size:0.65rem;color:#888;text-transform:uppercase;letter-spacing:0.3px}
/* Footer info */
.footer-note{
  text-align:center;
  padding:20px;
  font-size:0.75rem;
  color:#aaa;
  font-style:italic;
}
@media(max-width:480px){
  .stats{grid-template-columns:1fr 1fr;gap:6px}
  .hunter-grid{grid-template-columns:1fr 1fr}
  table{font-size:0.72rem}
}
</style>
</head>
<body>

<div class="hero">
  <h1>🦌 Cacciatori</h1>
  <p class="sub">Associazione Caccia · Stagione 2025/2026</p>
  <span class="badge">📊 Dashboard</span>
</div>

<div id="app"></div>

<script>
// ===== HARDCODED DATA (from Google Sheet fetch) =====
// This will be replaced with live data once the sheet is published
const CERVO_DATA = [
  {n:1, loc:"La Mont", data:"20/08/2025", ora:"10:00", cacciatore:"2163", peso:40, eta:1, luogo:"Cella sede"},
  {n:2, loc:"La Mont", data:"31/08/2025", ora:"6:30", cacciatore:"Case Claudio", peso:38, eta:1, luogo:"Cella sede"},
  {n:3, loc:"La Mont", data:"02/09/2025", ora:"19:00", cacciatore:"Piva Mattia", peso:28, eta:0, luogo:"Cella sede"},
  {n:4, loc:"Turbai", data:"07/09/2025", ora:"7:05", cacciatore:"Bettiolo Andrea", peso:38, eta:1, luogo:"Cella Cencenighe"},
  {n:5, loc:"Turbai", data:"25/10/2025", ora:"8:00", cacciatore:"Dalla Francesca", peso:82, eta:"4-5", luogo:"Caneva"},
  {n:6, loc:"La Mont", data:"16/11/2025", ora:"7:15", cacciatore:"Soc. Ursa Maior", peso:50, eta:2, luogo:"Cella sede"},
  {n:7, loc:"La Mont", data:"28/12/2025", ora:"14:00", cacciatore:"Ruzza Marco", peso:36, eta:1, luogo:"Cella sede"},
];

const FEMMINE_DATA = [
  {n:1, sesso:"F", loc:"La Mont", data:"09/08/2025", cacciatore:"Ruzza Marco", peso:null},
  {n:2, sesso:"F", loc:"La Mont", data:"18/08/2025", cacciatore:"Bettiolo Andrea", peso:null},
  {n:3, sesso:"M", loc:"La Mont", data:"23/08/2025", cacciatore:"Case Claudio", peso:null, note:"Capretto"},
  {n:4, sesso:"F", loc:"Gares", data:"22/09/2025", cacciatore:"Grespan Renato", peso:null},
  {n:5, sesso:"F", loc:"La Mont", data:"29/09/2025", cacciatore:"Dal Bianco Gabriele", peso:null},
  {n:6, sesso:"F", loc:"La Mont", data:"30/09/2025", cacciatore:"Soppelsa Elia", peso:null},
  {n:7, sesso:"F", loc:"La Mont", data:"04/10/2025", cacciatore:"Chiappetti Gianluca", peso:null},
  {n:8, sesso:"M", loc:"Turbai", data:"09/10/2025", cacciatore:"Ruzza Marco", peso:null, note:"Capretto"},
  {n:9, sesso:"F", loc:"Turbai", data:"09/10/2025", cacciatore:"Piva Mattia", peso:null},
  {n:10, sesso:"M", loc:"Gares", data:"12/10/2025", cacciatore:"Grespan Renato", peso:null, note:"Capretto"},
  {n:11, sesso:"F", loc:"La Mont", data:"14/10/2025", cacciatore:"Bettiolo Andrea", peso:null},
  {n:12, sesso:"F", loc:"Turbai", data:"08/11/2025", cacciatore:"Bettiolo Andrea", peso:null},
  {n:13, sesso:"F", loc:"Gares", data:"11/01/2026", cacciatore:"Grespan Renato", peso:null},
  {n:14, sesso:"F", loc:"La Mont", data:"18/01/2026", cacciatore:"Piva Mattia", peso:null},
];

// ===== RENDER =====
let currentFilter = null;

function getStats(){
  const f = currentFilter;
  const cervo = f ? CERVO_DATA.filter(r => r.loc === f) : CERVO_DATA;
  const femmine = f ? FEMMINE_DATA.filter(r => r.loc === f) : FEMMINE_DATA;
  const tot = cervo.length + femmine.length;
  const cacciatori = new Set();
  [...cervo, ...femmine].forEach(r => cacciatori.add(r.cacciatore));
  return { cervo: cervo.length, femmine: femmine.length, cacciatori: cacciatori.size, totale: tot };
}

function getLocations(){
  const set = new Set();
  CERVO_DATA.forEach(r => set.add(r.loc));
  FEMMINE_DATA.forEach(r => set.add(r.loc));
  return [...set].sort();
}

function getHunters(){
  const map = {};
  [...CERVO_DATA, ...FEMMINE_DATA].forEach(r => {
    if(!map[r.cacciatore]) map[r.cacciatore] = {cervo:0, femmine:0, capretti:0};
    if(r.note === "Capretto" || r.sesso === "M" && FEMMINE_DATA.includes(r)) map[r.cacciatore].capretti++;
    else if(CERVO_DATA.includes(r)) map[r.cacciatore].cervo++;
    else map[r.cacciatore].femmine++;
  });
  // Better counting
  const m2 = {};
  CERVO_DATA.forEach(r => { m2[r.cacciatore] = m2[r.cacciatore] || {cervo:0,femmine:0,capretti:0}; m2[r.cacciatore].cervo++; });
  FEMMINE_DATA.forEach(r => {
    m2[r.cacciatore] = m2[r.cacciatore] || {cervo:0,femmine:0,capretti:0};
    if(r.note === "Capretto") m2[r.cacciatore].capretti++;
    else m2[r.cacciatore].femmine++;
  });
  return m2;
}

function render(){
  const stats = getStats();
  const app = document.getElementById('app');
  
  let html = `
  <div class="stats">
    <div class="stat"><div class="num">${stats.cervo}</div><div class="label">Maschi</div></div>
    <div class="stat"><div class="num">${stats.femmine}</div><div class="label">Femmine</div></div>
    <div class="stat"><div class="num">${stats.cacciatori}</div><div class="label">Cacciatori</div></div>
    <div class="stat"><div class="num">${stats.totale}</div><div class="label">Totale</div></div>
  </div>`;

  // Filters
  html += `<div class="filters">
    <button class="filter-btn ${!currentFilter?'active':''}" onclick="setFilter(null)">Tutti</button>`;
  getLocations().forEach(l => {
    html += `<button class="filter-btn ${currentFilter===l?'active':''}" onclick="setFilter('${l}')">${l}</button>`;
  });
  html += `</div>`;

  // Cervo Maschio section
  const cervo = currentFilter ? CERVO_DATA.filter(r => r.loc === currentFilter) : CERVO_DATA;
  html += `<div class="section">
    <div class="section-header"><h2>🦌 Cervo Maschio</h2><span class="count">${cervo.length}</span></div>
    <div class="table-wrap">
    <table><thead><tr><th>#</th><th>Località</th><th>Data</th><th>Ora</th><th>Cacciatore</th><th>Peso</th><th>Età</th><th>Luogo</th></tr></thead><tbody>`;
  cervo.forEach(r => {
    html += `<tr><td>${r.n}</td><td>${r.loc}</td><td>${r.data}</td><td>${r.ora}</td><td><strong>${r.cacciatore}</strong></td><td>${r.peso} kg</td><td>${r.eta}</td><td>${r.luogo}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  // Femmine section
  const femmine = currentFilter ? FEMMINE_DATA.filter(r => r.loc === currentFilter) : FEMMINE_DATA;
  html += `<div class="section">
    <div class="section-header"><h2>🦌 Femmine & Capretti</h2><span class="count">${femmine.length}</span></div>
    <div class="table-wrap">
    <table><thead><tr><th>#</th><th>Sesso</th><th>Località</th><th>Data</th><th>Cacciatore</th><th>Note</th></tr></thead><tbody>`;
  femmine.forEach(r => {
    html += `<tr><td>${r.n}</td><td>${r.sesso === 'M' ? '♂️ Maschio' : '♀️ Femmina'}</td><td>${r.loc}</td><td>${r.data}</td><td><strong>${r.cacciatore}</strong></td><td>${r.note||'-'}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;

  // Hunter ranking
  const hunters = getHunters();
  html += `<div class="section">
    <div class="section-header"><h2>👤 Classifica Cacciatori</h2><span class="count">${Object.keys(hunters).length}</span></div>
    <div class="hunter-grid">`;
  Object.entries(hunters).sort((a,b) => (b[1].cervo+b[1].femmine) - (a[1].cervo+a[1].femmine)).forEach(([name,vals]) => {
    const tot = vals.cervo + vals.femmine + vals.capretti;
    html += `<div class="hunter-card"><div class="name">${name}</div><div class="count">${tot}</div><div class="label">${vals.cervo}M · ${vals.femmine}F · ${vals.capretti}C</div></div>`;
  });
  html += `</div></div>`;

  html += `<div class="footer-note">📊 Dati Stagione 2025/2026 · ${new Date().toLocaleDateString('it-IT')}</div>`;
  app.innerHTML = html;
}

function setFilter(loc){
  currentFilter = loc;
  render();
}

render();
</script>
</body>
</html>
