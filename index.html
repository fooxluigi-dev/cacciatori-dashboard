<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📊 Cacciatori — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f5f2eb;color:#2d2d2d;padding-bottom:80px}
.hero{background:linear-gradient(135deg,#1a3c34,#2d5a4a);color:#fff;padding:48px 20px 36px;text-align:center}
.hero h1{font-size:1.8rem;font-weight:800}
.hero .sub{font-size:0.85rem;opacity:0.8;margin-top:4px}
.hero .badge{display:inline-block;margin-top:12px;padding:6px 16px;background:rgba(255,255,255,0.1);border-radius:100px;font-size:0.75rem}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:16px;margin:-24px 12px 0}
.stat{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.stat .num{font-size:1.5rem;font-weight:800;color:#1a3c34}
.stat .label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.5px;color:#888;margin-top:2px}
.section{padding:20px 16px 8px}
.section h2{font-size:1.2rem;margin-bottom:2px}
.section .quota{font-size:0.8rem;color:#888;margin-bottom:12px}
.filter-bar{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{flex-shrink:0;padding:8px 16px;border-radius:100px;border:1.5px solid #1a3c34;background:transparent;color:#1a3c34;font-size:0.8rem;font-weight:600;cursor:pointer}
.filter-btn.active{background:#1a3c34;color:#fff}
.filter-btn.all{background:transparent;color:#888;border-color:#ccc}
.filter-btn.all.active{background:#1a3c34;color:#fff;border-color:#1a3c34}
table{width:100%;border-collapse:collapse;font-size:0.82rem;margin:0 16px;width:calc(100% - 32px)}
th{background:#1a3c34;color:#fff;padding:10px 8px;text-align:left;font-weight:600;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap}
td{padding:8px;border-bottom:1px solid #e8e4dc}
tr:nth-child(even){background:rgba(26,60,52,0.03)}
tr.quota{background:rgba(200,200,200,0.15);color:#aaa;font-style:italic}
.badge-quota{display:inline-block;padding:2px 10px;border-radius:100px;font-size:0.65rem;font-weight:600;background:#e8f5e9;color:#2e7d32}
.badge-quota.full{background:#ffebee;color:#c62828}
.hunter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.hunter-card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.hunter-card .name{font-weight:700;font-size:0.85rem}
.hunter-card .stats{display:flex;gap:8px;margin:0;padding:6px 0 0;font-size:0.75rem;color:#555}
.hunter-card .stats span{background:rgba(26,60,52,0.08);padding:2px 8px;border-radius:6px}
.footer{text-align:center;padding:32px 20px;color:#aaa;font-size:0.75rem;font-style:italic}
@media(max-width:480px){
  .stats{grid-template-columns:1fr 1fr}
  .hunter-grid{grid-template-columns:1fr}
  .stat .num{font-size:1.3rem}
  th{font-size:0.65rem;padding:8px 4px}
  td{font-size:0.75rem;padding:6px 4px}
}
</style>
</head>
<body>

<div class="hero">
  <h1>🦌 Cacciatori Gosaldo</h1>
  <p class="sub">Stagione 2025/2026 · Fusoni · Caprioli · Femmine</p>
  <div class="badge">Associazione Cacciatori</div>
</div>

<div id="app"></div>

<div class="footer">
  Dati aggiornati al 26 Maggio 2026 · <a href="https://docs.google.com/spreadsheets/d/1SSWMcFqKAvcke1YG1gJeLiymNLQO8IPtPxnWUxz2t_8" style="color:#888">Apri foglio</a>
</div>

<script>
// ===== DATA (from real Google Sheet) =====

// Sezione 1: Cervo Maschio 1^ Classe Fusoni — Quota 7
const MASCHI = [
  {n:1,loc:"La Mont",data:"20/08/2025",ora:"10:00",cacciatore:"2163",peso:40,eta:"1",luogo:"Cella sede"},
  {n:2,loc:"La Mont",data:"31/08/2025",ora:"06:30",cacciatore:"Case Claudio",peso:58,eta:"1",luogo:"Cella sede"},
  {n:3,loc:"Caminer",data:"11/09/2025",ora:"07:30",cacciatore:"Marcon Graziano",peso:65,eta:"1",luogo:"Cella sede"},
  {n:4,loc:"Pala del Gal",data:"11/09/2025",ora:"10:20",cacciatore:"2163",peso:70,eta:"1",luogo:"Cella sede"},
  {n:5,loc:"Turbai",data:"18/10/2025",ora:"18:50",cacciatore:"Masoch Moreno",peso:60,eta:"1",luogo:"Cella sede"},
  {n:6,loc:"La Mont",data:"27/10/2025",ora:"",cacciatore:"Ren Mario",peso:53,eta:"1",luogo:"Cella sede"},
  {n:7,loc:"—",data:"",ora:"",cacciatore:"",peso:"",eta:"",luogo:"",quota:true},
];
const QUOTA_MASCHI = 7;

// Sezione 2: Cervo 2^ Classe — Quota 8
const CERVI = [
  {n:1,loc:"Acqua della Bisa",data:"18/10/2025",ora:"06:50",cacciatore:"Marcon Davide",accompagnatore:"Marcon Ivan",peso:95,eta:"2/3",luogo:"Cella sede",note:"Piano completato"},
  {n:2,loc:"Col Mean",data:"18/10/2025",ora:"07:15",cacciatore:"Bedont Romeo",accompagnatore:"",peso:115,eta:"5/6",luogo:"Cella sede"},
  {n:3,loc:"Pala de Camp",data:"18/10/2025",ora:"07:35",cacciatore:"Bedont Ernesto",accompagnatore:"",peso:116,eta:"5/6",luogo:"Cella sede"},
  {n:4,loc:"Valeselle",data:"25/10/2025",ora:"07:20",cacciatore:"Masoch Simone",accompagnatore:"",peso:130,eta:"5/6",luogo:"Cella sede"},
  {n:5,loc:"Lagon",data:"01/11/2025",ora:"07:00",cacciatore:"Renon Stefano",accompagnatore:"",peso:127,eta:"7",luogo:"Cella sede"},
  {n:6,loc:"Turbai",data:"16/11/2025",ora:"07:00",cacciatore:"Bressan Alan",accompagnatore:"",peso:100,eta:"3",luogo:"Cella sede"},
  {n:7,loc:"Scur",data:"19/11/2025",ora:"07:20",cacciatore:"Dell'Olivo Giuliano",accompagnatore:"",peso:"",eta:"4/5",luogo:"Cella sede"},
  {n:8,loc:"—",data:"",ora:"",cacciatore:"",accompagnatore:"",peso:"",eta:"",luogo:"",quota:true},
];
const QUOTA_CERVI = 8;

// Sezione 3: Caprioli — Quota 8
const CAPRIOLI = [
  {n:1,loc:"Cavallera",data:"18/10/2025",ora:"06:45",cacciatore:"Bressan Alan",peso:82,eta:"5",luogo:"Cella sede"},
  {n:2,loc:"Pian Lonc",data:"22/10/2025",ora:"07:20",cacciatore:"Masoch Simone",peso:66,eta:"2/3",luogo:"Cella sede"},
  {n:3,loc:"Stalnof",data:"09/11/2025",ora:"07:20",cacciatore:"Masoch Moreno",peso:80,eta:"",luogo:"Cella sede"},
  {n:4,loc:"Margonola",data:"24/11/2025",ora:"16:50",cacciatore:"Bressan Alan",peso:75,eta:"3",luogo:"Cella sede"},
  {n:5,loc:"Melane",data:"25/11/2025",ora:"07:05",cacciatore:"Case Claudio",peso:79,eta:"4",luogo:"Cella sede"},
  {n:6,loc:"—",data:"",ora:"",cacciatore:"",peso:"",eta:"",luogo:"",quota:true},
  {n:7,loc:"—",data:"",ora:"",cacciatore:"",peso:"",eta:"",luogo:"",quota:true},
  {n:8,loc:"—",data:"",ora:"",cacciatore:"",peso:"",eta:"",luogo:"",quota:true},
];
const QUOTA_CAPRIOLI = 8;

// Sezione 4: Femmine e Capretti
const FEMMINE = [
  {n:1,sesso:"F",loc:"Cristo delle traversade",data:"20/10/2025",ora:"16:45",cacciatore:"Marcon Davide",accompagnatore:"Marcon Ivan",peso:45,luogo:"Cella Sede"},
  {n:2,sesso:"M",loc:"Zech",data:"20/10/2025",ora:"18:20",cacciatore:"Casaril Oscar",accompagnatore:"",peso:47,luogo:"Cella Sede"},
  {n:3,sesso:"F",loc:"Pala de Camp",data:"08/11/2025",ora:"07:20",cacciatore:"Bedont Ernesto",accompagnatore:"",peso:40,luogo:"Cella Sede"},
  {n:4,sesso:"M",loc:"Selle",data:"12/11/2025",ora:"09:50",cacciatore:"Case Claudio",accompagnatore:"",peso:39,luogo:"Cella Sede"},
  {n:5,sesso:"F",loc:"Domadore",data:"17/11/2025",ora:"08:00",cacciatore:"Casaril Oscar",accompagnatore:"",peso:40,luogo:"Cella Sede"},
];

// Collect all unique hunters
const allEntries = [...MASCHI.filter(r=>r.cacciatore), ...CERVI.filter(r=>r.cacciatore), ...CAPRIOLI.filter(r=>r.cacciatore), ...FEMMINE.filter(r=>r.cacciatore)];
const HUNTERS = [...new Set(allEntries.map(r=>r.cacciatore).filter(Boolean))].sort();

// ===== LOCALITÀ =====
const LOCALITA = [...new Set([
  ...MASCHI.filter(r=>r.loc&&r.loc!="—").map(r=>r.loc),
  ...CERVI.filter(r=>r.loc&&r.loc!="—").map(r=>r.loc),
  ...CAPRIOLI.filter(r=>r.loc&&r.loc!="—").map(r=>r.loc),
  ...FEMMINE.filter(r=>r.loc&&r.loc!="—").map(r=>r.loc),
])].sort();

let currentFilter = null;

function getStats(f){
  const fm = f ? MASCHI.filter(r=>r.loc===f) : MASCHI.filter(r=>r.cacciatore);
  const fc = f ? CERVI.filter(r=>r.loc===f) : CERVI.filter(r=>r.cacciatore);
  const fcap = f ? CAPRIOLI.filter(r=>r.loc===f) : CAPRIOLI.filter(r=>r.cacciatore);
  const ff = f ? FEMMINE.filter(r=>r.loc===f) : FEMMINE.filter(r=>r.cacciatore);
  return {
    maschi: fm.length,
    cervi: fc.length,
    caprioli: fcap.length,
    femmine: ff.length,
    cacciatori: [...new Set([...fm,...fc,...fcap,...ff].map(r=>r.cacciatore).filter(Boolean))].length
  };
}

function renderTable(title, data, quota, columns, emptyMsg){
  const filtered = currentFilter ? data.filter(r=>r.loc===currentFilter||r.quota) : data;
  let html = `<div class="section"><h2>${title}</h2><p class="quota">Quota: <strong>${quota}</strong> · Abbattuti: <strong>${data.filter(r=>r.cacciatore).length}</strong> · Rimasti: <strong>${quota - data.filter(r=>r.cacciatore).length}</strong></p></div>`;
  if(filtered.filter(r=>r.cacciatore).length === 0){
    html += `<p style="padding:0 16px;color:#888;font-size:0.85rem">${emptyMsg}</p>`;
  }
  html += `<table><thead><tr>${columns.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`;
  filtered.forEach(r => {
    if(r.quota){
      html += `<tr class="quota"><td colspan="${columns.length}" style="text-align:center">\u{1F514} Quota disponibile</td></tr>`;
      return;
    }
    html += `<tr>${columns.map(c=>{
      if(c==="N°") return `<td>${r.n}</td>`;
      if(c==="Località") return `<td><strong>${r.loc||""}</strong></td>`;
      if(c==="Data") return `<td>${r.data||""}</td>`;
      if(c==="Ora") return `<td>${r.ora||""}</td>`;
      if(c==="Cacciatore") return `<td><strong>${r.cacciatore||""}</strong></td>`;
      if(c==="Accomp.") return `<td>${r.accompagnatore||""}</td>`;
      if(c==="Peso") return `<td>${r.peso?r.peso+" kg":""}</td>`;
      if(c==="Età") return `<td>${r.eta||""}</td>`;
      if(c==="Luogo") return `<td>${r.luogo||""}</td>`;
      if(c==="Sesso") return `<td>${r.sesso==="M"?"♂":"♀"}</td>`;
      if(c==="Note") return `<td>${r.note||""}</td>`;
      return `<td></td>`;
    }).join("")}</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function renderHunters(){
  const hunterMap = {};
  [...MASCHI,...CERVI,...CAPRIOLI,...FEMMINE].filter(r=>r.cacciatore).forEach(r => {
    if(!hunterMap[r.cacciatore]) hunterMap[r.cacciatore] = {M:0,F:0,Cap:0};
    if(r.sesso) {
      if(r.sesso==="M" && !r.n) hunterMap[r.cacciatore].Cap++;
      else if(r.sesso==="M") hunterMap[r.cacciatore].M++;
      else hunterMap[r.cacciatore].F++;
    } else {
      // cervo/capriolo section
      const src = MASCHI.includes(r)||CERVI.includes(r) ? "M" : null;
      if(src) hunterMap[r.cacciatore].M++;
      else hunterMap[r.cacciatore].F++;
    }
  });
  // Recalculate properly
  Object.keys(hunterMap).forEach(k => { delete hunterMap[k]; });
  [...MASCHI,...CERVI,...CAPRIOLI].filter(r=>r.cacciatore).forEach(r => {
    if(!hunterMap[r.cacciatore]) hunterMap[r.cacciatore] = {M:0,F:0,Cap:0,Mc:0};
    hunterMap[r.cacciatore].M++;
  });
  [...MASCHI,...CERVI,...CAPRIOLI].filter(r=>r.loc==="—").forEach(r => {
    // skip quota rows
  });
  FEMMINE.filter(r=>r.cacciatore).forEach(r => {
    if(!hunterMap[r.cacciatore]) hunterMap[r.cacciatore] = {M:0,F:0,Cap:0,Mc:0};
    if(r.sesso==="M") hunterMap[r.cacciatore].Cap++;
    else hunterMap[r.cacciatore].F++;
  });

  const sorted = Object.entries(hunterMap).sort((a,b) => (b[1].M+b[1].F+b[1].Cap+b[1].Mc) - (a[1].M+a[1].F+a[1].Cap+a[1].Mc));
  let html = `<div class="section"><h2>👤 Classifica Cacciatori</h2><p class="quota">Totale: <strong>${sorted.length}</strong> cacciatori</p></div><div class="hunter-grid">`;
  sorted.forEach(([name,stats]) => {
    const tot = stats.M + stats.F + stats.Cap + (stats.Mc||0);
    html += `<div class="hunter-card"><div class="name">${name}</div><div class="stats">`;
    if(stats.M > 0) html += `<span>🦌 ${stats.M}</span>`;
    if(stats.F > 0) html += `<span>♀ ${stats.F}</span>`;
    if(stats.Cap > 0) html += `<span>🐐 ${stats.Cap}</span>`;
    if(stats.Mc > 0) html += `<span>♂ ${stats.Mc}</span>`;
    html += `<span style="background:#1a3c34;color:#fff">${tot}</span>`;
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

function render(){
  const s = getStats(currentFilter);
  const app = document.getElementById('app');

  let html = `<div class="stats">
    <div class="stat"><div class="num">${s.maschi}</div><div class="label">Maschi</div></div>
    <div class="stat"><div class="num">${s.cervi+s.caprioli}</div><div class="label">Cervi/Capr.</div></div>
    <div class="stat"><div class="num">${s.femmine}</div><div class="label">Femmine</div></div>
    <div class="stat"><div class="num">${s.cacciatori}</div><div class="label">Cacciatori</div></div>
  </div>`;

  // Filter bar
  html += `<div class="filter-bar">`;
  html += `<button class="filter-btn all ${!currentFilter?'active':''}" onclick="setFilter(null)">Tutti</button>`;
  LOCALITA.forEach(l => {
    html += `<button class="filter-btn ${currentFilter===l?'active':''}" onclick="setFilter('${l}')">${l}</button>`;
  });
  html += `</div>`;

  // Tables
  const maschiReali = MASCHI.filter(r=>r.cacciatore).length;
  html += renderTable("🦌 Cervo Maschio (1^ Classe Fusoni)", MASCHI, QUOTA_MASCHI, ["N°","Località","Data","Ora","Cacciatore","Peso","Età","Luogo"], "Nessun maschio abbattuto per questa località");
  html += renderTable("🦌 Cervo (2^ Classe)", CERVI, QUOTA_CERVI, ["N°","Località","Data","Ora","Cacciatore","Accomp.","Peso","Età","Note","Luogo"], "Nessun cervo abbattuto per questa località");
  html += renderTable("🐐 Caprioli", CAPRIOLI, QUOTA_CAPRIOLI, ["N°","Località","Data","Ora","Cacciatore","Peso","Età","Luogo"], "Nessun capriolo abbattuto per questa località");
  html += renderTable("♀️ Femmine", FEMMINE, FEMMINE.length, ["N°","Sesso","Località","Data","Ora","Cacciatore","Accomp.","Peso","Luogo"], "Nessuna femmina abbattuta per questa località");

  // Quota complessiva
  const totAbbattuti = maschiReali + CERVI.filter(r=>r.cacciatore).length + CAPRIOLI.filter(r=>r.cacciatore).length + FEMMINE.filter(r=>r.cacciatore).length;
  const totQuota = QUOTA_MASCHI + QUOTA_CERVI + QUOTA_CAPRIOLI + FEMMINE.length;
  const fullPct = Math.round(totAbbattuti/totQuota*100);
  html += `<div class="section"><h2>📊 Totali Stagione</h2></div>
  <div style="padding:0 16px">
    <div style="background:#e8e4dc;border-radius:100px;height:24px;overflow:hidden;margin-bottom:8px">
      <div style="background:linear-gradient(90deg,#1a3c34,#2d5a4a);width:${fullPct}%;height:100%;border-radius:100px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:0.75rem">${fullPct}%</div>
    </div>
    <p style="font-size:0.85rem;color:#555">Abbattuti <strong>${totAbbattuti}</strong> di <strong>${totQuota}</strong> capi totali</p>
  </div>`;

  // Hunter ranking
  html += renderHunters();

  app.innerHTML = html;
}

function setFilter(loc){
  currentFilter = loc;
  render();
}

render();
</script>
</body>
</html>
